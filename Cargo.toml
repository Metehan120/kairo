[package]
name = "kairo"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = { version = "0.8.5", features = ["crossbeam-queue", "crossbeam-deque"] }
io-uring = "0.7.16"
spin = "0.12.3"
thiserror = "2.0.21"
num_cpus = "1.17.0"

[dev-dependencies]
async-channel = "2.5.0"
async-h1 = "2.3"
async-net = "2.0"
http-types = "2.12"
scraper = "0.29"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
